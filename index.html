<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>臨床護理工作手冊與病房分層目錄系統</title>

  <style>
    :root {
      --primary-color: #d86979;
      --primary-dark: #b84a5a;
      --primary-light: #fce8eb;
      --bg-color: #fff8f5;
      --sidebar-width: 300px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; }

    body { 
      font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background-color: var(--bg-color); 
      background-image: radial-gradient(#f7d0d6 1.5px, transparent 1.5px), radial-gradient(#f7d0d6 1.5px, var(--bg-color) 1.5px);
      background-size: 40px 40px;
      color: #4a3e3d; 
      display: flex; 
      overflow: hidden; 
    }

    .sidebar-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(74, 62, 61, 0.35); backdrop-filter: blur(2px); z-index: 998;
    }

    #sidebar { 
      width: var(--sidebar-width); min-width: var(--sidebar-width);
      background: #ffffff; border-right: 2px solid #f2e2df; 
      display: flex; flex-direction: column; z-index: 999; height: 100vh;
      box-shadow: 4px 0 15px rgba(216, 105, 121, 0.08);
    }

    .sidebar-header { 
      padding: 16px; background: linear-gradient(135deg, #e87a90, var(--primary-color)); 
      color: white; font-weight: bold; font-size: 1.15em; display: flex; justify-content: space-between; align-items: center;
    }

    .search-box { padding: 12px; border-bottom: 1px solid #fce8eb; background: #fffcfb; }
    .search-box input { width: 100%; padding: 10px 14px; border: 1.5px solid #f7d0d6; border-radius: 20px; outline: none; }
    
    .nav-tree { flex: 1; overflow-y: auto; padding: 12px; }
    details { margin-bottom: 8px; }
    summary { font-weight: bold; cursor: pointer; padding: 9px 12px; border-radius: 10px; user-select: none; }
    summary:hover { background: var(--primary-light); }
    
    .folder-fav > summary { color: #d81b60; font-size: 1.05em; border-bottom: 2px dashed #f48fb1; background: #fff0f5; }
    .folder-main > summary { color: var(--primary-dark); font-size: 1.05em; border-bottom: 2px solid #f7d0d6; margin-top: 8px; }
    .folder-sub { margin-left: 10px; }
    .folder-sub > summary { color: #e07a5f; font-size: 0.95em; }

    .file-item { 
      padding: 10px 12px; margin-left: 18px; border-radius: 10px; cursor: pointer; font-size: 0.92em; 
      color: #5a4b4a; border-left: 3px solid #f7d0d6; margin-top: 5px; display: flex; justify-content: space-between; align-items: center; background: #fffcfb; 
    }
    .file-item:hover, .file-item.active { background: var(--primary-color); color: white; border-left: 4px solid var(--primary-dark); font-weight: bold; }

    #main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative; }
    .top-bar { height: 60px; background: rgba(255, 255, 255, 0.95); border-bottom: 1.5px solid #fce8eb; display: flex; justify-content: space-between; align-items: center; padding: 0 18px; gap: 10px; }
    .top-left { display: flex; align-items: center; gap: 10px; }

    .status-badge { font-size: 0.8em; padding: 5px 12px; border-radius: 15px; background: #f0e6e4; color: #776563; }
    .status-badge.admin { background: #e8f5e9; color: #2e7d32; font-weight: bold; }
    .cloud-badge { font-size: 0.75em; padding: 4px 8px; border-radius: 8px; background: #e3f2fd; color: #1565c0; font-weight: bold; }

    .btn { padding: 8px 14px; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.88em; display: inline-flex; align-items: center; gap: 5px; }
    .btn-primary { background: var(--primary-color); color: white; }
    .btn-danger { background: #f4511e; color: white; }
    .btn-success { background: #43a047; color: white; }
    .btn-fav { background: #fff8e1; color: #f57f17; border: 1px solid #ffe082; }
    .btn-fav.active { background: #ffecb3; color: #e65100; font-weight: bold; }
    .menu-toggle-btn { display: none; background: #fce8eb; color: var(--primary-dark); }

    .content-body { flex: 1; overflow-y: auto; padding: 20px; }
    .article-card { background: #ffffff; padding: 28px; border-radius: 18px; box-shadow: 0 8px 24px rgba(216, 105, 121, 0.08); max-width: 920px; margin: 0 auto; border: 1px solid #fdeef0; }
    .article-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; gap: 10px; border-bottom: 2px dashed #fce8eb; padding-bottom: 12px; }
    .article-title { font-size: 1.5em; color: #3a2e2d; flex: 1; font-weight: bold; word-break: break-word; }
    .article-path { font-size: 0.82em; color: var(--primary-color); font-weight: bold; margin-bottom: 12px; display: inline-block; background: var(--primary-light); padding: 5px 12px; border-radius: 12px; }

    /* 全局文字自動換行與防跑版保護 */
    .article-text, .editor-container { 
      line-height: 1.85; 
      color: #4a3e3d; 
      font-size: 1.02em; 
      word-break: break-word;
      overflow-wrap: break-word;
    }

    /* 手機端 Word 表格強效適應與橫向滾動 */
    .article-text table, .editor-container table {
      display: block !important;
      width: 100% !important;
      max-width: 100% !important;
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch;
      border-collapse: collapse !important;
      margin: 14px 0 !important;
    }

    .article-text td, .article-text th,
    .editor-container td, .editor-container th {
      min-width: 80px;
      word-break: break-word !important;
      overflow-wrap: break-word !important;
      padding: 8px 10px !important;
      border: 1px solid #f7d0d6 !important;
      font-size: 0.95em;
    }

    .article-text tr:nth-child(even),
    .editor-container tr:nth-child(even) {
      background-color: #fff9fa;
    }

    img, video, iframe { max-width: 100% !important; height: auto !important; border-radius: 8px; margin: 10px 0; display: block; }

    #edit-form { display: none; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.92em; color: #5a4b4a; }
    .form-group input, .form-group select { width: 100%; padding: 11px; border: 1.5px solid #f7d0d6; border-radius: 10px; font-size: 1em; outline: none; background: #fffcfb; }
    
    .editor-container { min-height: 300px; max-height: 550px; overflow-y: auto; border: 1.5px solid #f7d0d6; border-radius: 10px; padding: 14px; background: #ffffff; outline: none; }
    .editor-toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; background: #fff5f6; padding: 8px; border-radius: 10px; border: 1px solid #fce8eb; }
    .tool-btn { padding: 6px 12px; font-size: 0.85em; border-radius: 6px; border: 1px solid #f7d0d6; background: white; cursor: pointer; font-weight: bold; color: #5a4b4a; }
