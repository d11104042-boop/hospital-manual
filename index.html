<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- 防止搜尋引擎索引與抓取 -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>臨床護理工作手冊與病房分層目錄系統</title>
  
  <!-- Firebase Web SDK (v10 compat 版本) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary-color: #d86979; /* 暖粉紅主色 */
      --primary-dark: #b84a5a;
      --primary-light: #fce8eb;
      --accent-color: #f4a261;
      --bg-color: #fff8f5;     /* 柔和蜜桃奶油底色 */
      --sidebar-width: 320px;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    body { 
      font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background-color: var(--bg-color); 
      background-image: 
        radial-gradient(#f7d0d6 1.5px, transparent 1.5px), 
        radial-gradient(#f7d0d6 1.5px, var(--bg-color) 1.5px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      color: #4a3e3d; 
      display: flex; 
      height: 100vh; 
      height: 100dvh; 
      overflow: hidden; 
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(74, 62, 61, 0.35);
      backdrop-filter: blur(2px);
      z-index: 998;
    }

    #sidebar { 
      width: var(--sidebar-width); 
      background: #ffffff; 
      border-right: 2px solid #f2e2df; 
      display: flex; 
      flex-direction: column; 
      z-index: 999;
      transition: transform 0.3s ease-in-out;
      box-shadow: 4px 0 15px rgba(216, 105, 121, 0.08);
    }

    .sidebar-header { 
      padding: 16px; 
      background: linear-gradient(135deg, #e87a90, var(--primary-color)); 
      color: white; 
      font-weight: bold; 
      font-size: 1.15em;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      box-shadow: 0 4px 10px rgba(216, 105, 121, 0.2);
    }

    .search-box { 
      padding: 12px; 
      border-bottom: 1px solid #fce8eb; 
      background: #fffcfb; 
    }

    .search-box input { 
      width: 100%; 
      padding: 10px 14px; 
      border: 1.5px solid #f7d0d6; 
      border-radius: 20px; 
      font-size: 0.95em; 
      outline: none; 
      background: #ffffff; 
      color: #4a3e3d; 
    }

    .search-box input:focus { 
      border-color: var(--primary-color); 
    }
    
    .nav-tree { 
      flex: 1; 
      overflow-y: auto; 
      padding: 12px; 
      -webkit-overflow-scrolling: touch; 
    }

    details { margin-bottom: 8px; }

    summary { 
      font-weight: bold; 
      cursor: pointer; 
      padding: 9px 12px; 
      border-radius: 10px; 
      user-select: none; 
      transition: background 0.2s; 
      outline: none; 
    }

    summary:hover, summary:active { background: var(--primary-light); }
    
    .folder-fav > summary { 
      color: #d81b60; 
      font-size: 1.05em; 
      border-bottom: 2px dashed #f48fb1; 
      margin-top: 4px; 
      background: #fff0f5; 
    }

    .folder-main > summary { 
      color: var(--primary-dark); 
      font-size: 1.05em; 
      border-bottom: 2px solid #f7d0d6; 
      margin-top: 8px; 
    }

    .folder-sub { margin-left: 10px; }
    .folder-sub > summary { color: #e07a5f; font-size: 0.95em; }

    .file-item { 
      padding: 10px 12px; 
      margin-left: 18px; 
      border-radius: 10px; 
      cursor: pointer; 
      font-size: 0.92em; 
      color: #5a4b4a; 
      transition: 0.2s; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      border-left: 3px solid #f7d0d6; 
      margin-top: 5px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: #fffcfb; 
    }

    .file-item:hover, .file-item.active { 
      background: var(--primary-color); 
      color: white; 
      border-left: 4px solid var(--primary-dark); 
      font-weight: bold; 
      box-shadow: 0 2px 8px rgba(216, 105, 121, 0.3); 
    }

    #main-content { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
      background: transparent; 
      position: relative; 
    }

    .top-bar { 
      height: 60px; 
      background: rgba(255, 255, 255, 0.9); 
      backdrop-filter: blur(8px); 
      border-bottom: 1.5px solid #fce8eb; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 0 18px; 
      gap: 10px; 
    }

    .top-left { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      overflow: hidden; 
    }

    .status-badge { 
      font-size: 0.8em; 
      padding: 5px 12px; 
      border-radius: 15px; 
      background: #f0e6e4; 
      color: #776563; 
      white-space: nowrap; 
    }

    .status-badge.admin { 
      background: #e8f5e9; 
      color: #2e7d32; 
      font-weight: bold; 
    }

    .cloud-badge { 
      font-size: 0.75em; 
      padding: 4px 8px; 
      border-radius: 8px; 
      background: #e3f2fd; 
      color: #1565c0; 
      font-weight: bold; 
    }

    .btn { 
      padding: 9px 14px; 
      border: none; 
      border-radius: 20px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 0.88em; 
      transition: 0.2s; 
      white-space: nowrap; 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      gap: 5px; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.06); 
    }

    .btn-primary { background: var(--primary-color); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-danger { background: #f4511e; color: white; }
    .btn-success { background: #43a047; color: white; font-size: 0.92em; }
    .btn-success:hover { background: #2e7d32; }
    .btn-fav { background: #fff8e1; color: #f57f17; border: 1px solid #ffe082; }
    .btn-fav.active { background: #ffecb3; color: #e65100; font-weight: bold; }
    .menu-toggle-btn { display: none; background: #fce8eb; color: var(--primary-dark); }

    .content-body { flex: 1; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; }
    
    .article-card { 
      background: #ffffff; 
      padding: 28px; 
      border-radius: 18px; 
      box-shadow: 0 8px 24px rgba(216, 105, 121, 0.08); 
      max-width: 920px; 
      margin: 0 auto; 
      border: 1px solid #fdeef0;
      position: relative;
      overflow: hidden;
    }
    
    .article-card::after {
      content: "👶🍼✨";
      position: absolute;
      bottom: -15px;
      right: 15px;
      font-size: 4.5em;
      opacity: 0.06;
      pointer-events: none;
    }

    .article-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-start; 
      margin-bottom: 15px; 
      gap: 10px; 
      border-bottom: 2px dashed #fce8eb; 
      padding-bottom: 12px; 
    }

    .article-title { 
      font-size: 1.5em; 
      color: #3a2e2d; 
      word-break: break-word; 
      flex: 1; 
      font-weight: bold; 
    }

      font-size: 0.82em; 
      color: var(--primary-color); 
      font-weight: bold; 
      margin-bottom:
